[package]
name = "minusd"
version = "0.1.0"
description = "MinUSD Solana lifecycle — educational testnet prototype"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "minusd"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
