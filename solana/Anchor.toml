[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

# Localnet ID is synced by `scripts/prepare-keys.sh` from a gitignored keypair.
# Do not publish a Devnet program ID until you deploy with a private, offline key.
[programs.localnet]
minusd = "7fyK8h8CGpPYjLhvNGWWbA2TccaSx69EvRLxQrJsSWMh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
