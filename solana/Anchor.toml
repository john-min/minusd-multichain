[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

# Localnet ID is synced by `scripts/prepare-keys.sh` from a gitignored keypair.
# Do not publish a Devnet program ID until you deploy with a private, offline key.
[programs.localnet]
minusd = "7fyK8h8CGpPYjLhvNGWWbA2TccaSx69EvRLxQrJsSWMh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

# Load workspace programs with --upgradeable-program so ProgramData records the
# wallet as upgrade authority. Default --bpf-program uses Pubkey::default(), which
# makes upgrade-authority-gated initialize impossible under `anchor test`.
# Must be under [test], not [test.validator] (see Anchor.toml docs).
[test]
upgradeable = true

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
